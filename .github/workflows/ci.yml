name: CI

# Bisher gab es überhaupt keine automatisierte Prüfung — Tests, Linter
# (ruff, oxlint) und der TypeScript-strict-Build liefen nur, wenn sie
# jemand manuell anstößt. Diese Pipeline lässt jeden Push/PR automatisch
# durch dieselben Prüfungen laufen, die diese Session durchgängig manuell
# vor jedem Commit ausgeführt hat.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Ohne explizites Limit gilt GitHub Actions' Default von 360 Minuten —
    # ein hängender Test/Request würde sonst sechs Stunden lang CI-Minuten
    # verbrauchen statt sichtbar zu scheitern.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # Netzwerkfrei (§0: FakeLLMClient/FakeEmbeddingFunction, siehe
      # tests/fakes.py) — braucht keine API-Keys/Secrets.
      - run: pytest -q
      - run: ruff check .
      # CVE-Scan gegen die tatsächlich installierten Versionen. Ignorierte
      # IDs sind geprüft und als für diese App nicht anwendbar dokumentiert
      # (siehe Sicherheitshinweis in app/agent/vector_store.py) — betreffen
      # ausschließlich den optionalen, hier nie gestarteten Chroma-Server
      # bzw. dessen RBAC-Provider, bzw. (setuptools) einen macOS-spezifischen
      # Build-Zeit-Bug, der uns auf Linux/CI nicht betrifft. Jede NEUE,
      # nicht ignorierte CVE lässt den Job bewusst fehlschlagen.
      - run: |
          pip install pip-audit
          python -m pip_audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln PYSEC-2026-3447

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - run: npm audit
