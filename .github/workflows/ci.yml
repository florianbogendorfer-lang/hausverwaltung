name: CI

# Bisher gab es überhaupt keine automatisierte Prüfung — Tests, Linter
# (ruff, oxlint) und der TypeScript-strict-Build liefen nur, wenn sie
# jemand manuell anstößt. Diese Pipeline lässt jeden Push/PR automatisch
# durch dieselben Prüfungen laufen, die diese Session durchgängig manuell
# vor jedem Commit ausgeführt hat.

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Ohne explizites Limit gilt GitHub Actions' Default von 360 Minuten —
    # ein hängender Test/Request würde sonst sechs Stunden lang CI-Minuten
    # verbrauchen statt sichtbar zu scheitern.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # Netzwerkfrei (§0: FakeLLMClient/FakeEmbeddingFunction, siehe
      # tests/fakes.py) — braucht keine API-Keys/Secrets.
      - run: pytest -q
      - run: ruff check .
      # CVE-Scan gegen die tatsächlich installierten Versionen. Ignorierte
      # IDs sind geprüft und als für diese App nicht anwendbar dokumentiert
      # (siehe Sicherheitshinweis in app/agent/vector_store.py) — betreffen
      # ausschließlich den optionalen, hier nie gestarteten Chroma-Server
      # bzw. dessen RBAC-Provider, bzw. (setuptools) einen macOS-spezifischen
      # Build-Zeit-Bug, der uns auf Linux/CI nicht betrifft. Jede NEUE,
      # nicht ignorierte CVE lässt den Job bewusst fehlschlagen.
      - run: |
          pip install pip-audit
          python -m pip_audit \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln PYSEC-2026-3447

  migrationen:
    # Die eigentlichen Tests laufen gegen SQLite (SQLModel.create_all, kein
    # Alembic) — die Alembic-Migrationskette selbst (der tatsächliche
    # Schema-Weg im Deploy, siehe docker-entrypoint.sh: `alembic upgrade
    # head` gegen Postgres) wurde bisher nirgends automatisch geprüft. Ein
    # Postgres-inkompatibles Migrations-Statement wäre erst beim echten
    # Clever-Cloud-Deploy aufgefallen. Dieser Job spielt die komplette Kette
    # gegen einen echten Postgres-Service, dann `python -m app.seed`
    # (läuft bei jedem Deploy-Start ebenfalls unconditional mit).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hv
          POSTGRES_PASSWORD: hv
          POSTGRES_DB: hv
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      HV_DATABASE_URL: postgresql+psycopg://hv:hv@localhost:5432/hv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - run: python -m app.seed

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx oxlint
      - run: npm test
      - run: npm run build
      - run: npm audit
