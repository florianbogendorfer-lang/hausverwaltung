[project]
name = "hausverwaltung-agent"
version = "0.1.0"
description = "HITL-Agent für Hausverwaltung (Prototyp) — Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "chromadb>=1.0",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
