[project]
name = "hausverwaltung-agent"
version = "0.1.0"
description = "HITL-Agent für Hausverwaltung (Prototyp) — Backend"
requires-python = ">=3.11"
# Obergrenzen (aktuell größte getestete Major-Version, siehe pip freeze
# dieser Session) statt rein unterer Schranken: das Docker-Image wird bei
# jedem Deploy frisch aus `pip install .` gebaut (kein Lockfile) — ohne
# Obergrenze könnte ein zukünftiger Breaking-Major-Release einer
# Abhängigkeit den nächsten Deploy silent brechen, ohne dass sich am
# eigenen Code etwas geändert hätte.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "anthropic>=0.40,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "chromadb>=1.0,<2.0",
    "bcrypt>=4.1,<6.0",
    "mistralai>=1.0,<3.0",
    "openai>=1.0,<4.0",
    "email-validator>=2.0,<3.0",
    "sentry-sdk[fastapi]>=2.0,<3.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.16,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Rufs eigener empfohlener Einstiegs-Regelsatz (E4/E7/E9 Pycodestyle,
# F Pyflakes) — findet echte Bugs (unbenutzte Importe, undefinierte Namen,
# Syntaxfehler) ohne stilistische/subjektive Regeln (Import-Sortierung,
# Docstring-Konventionen etc.) zu erzwingen, die dieser Codebase bisher
# nie auferlegt waren. Bewusst kein größerer Regelsatz, um nicht auf
# einen Schlag hunderte kosmetische Fund-Meldungen einzuführen.
select = ["E4", "E7", "E9", "F"]
